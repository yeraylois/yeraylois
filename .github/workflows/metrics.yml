name: Generate Profile Metrics

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - filename: assets/metrics/base.svg
            css: >-
              h1,h2,h3,.activity .issue{color:#5c6bc0!important}
              [fill="#9be9a8"]{fill:#b6e3ff!important}
              [fill="#40c463"]{fill:#54aeff!important}
              [fill="#30a14e"]{fill:#0969da!important}
              [fill="#216e39"]{fill:#0a3069!important}
              @media (prefers-color-scheme: dark){
              h1,h2,h3,.activity .issue{color:#9be9a8!important}
              [fill="#9be9a8"]{fill:#9be9a8!important}
              [fill="#40c463"]{fill:#40c463!important}
              [fill="#30a14e"]{fill:#30a14e!important}
              [fill="#216e39"]{fill:#216e39!important}}
          - filename: assets/metrics/base-es.svg
            css: >-
              h1,h2,h3,.activity .issue{color:#d97757!important}
              [fill="#9be9a8"]{fill:#f7d9cc!important}
              [fill="#40c463"]{fill:#eda98c!important}
              [fill="#30a14e"]{fill:#d97757!important}
              [fill="#216e39"]{fill:#8f3f26!important}
    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
          user: yeraylois
          filename: ${{ matrix.filename }}
          extras_css: ${{ matrix.css }}
          committer_branch: main
          committer_message: "chore(metrics): refresh profile metrics [skip ci]"
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid
          config_twemoji: yes
          plugin_habits: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
